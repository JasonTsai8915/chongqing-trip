name: Build StockDashboard executable

on:
  push:
    paths:
      - "stock_dashboard/**"
      - ".github/workflows/build-stock-dashboard.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StockDashboard-windows
          - os: macos-latest
            artifact: StockDashboard-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: stock_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m pytest -q tests
      - name: Build executable
        run: pyinstaller --noconfirm --clean stock_dashboard.spec
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/StockDashboard.exe -DestinationPath ${{ matrix.artifact }}.zip
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip ../${{ matrix.artifact }}.zip StockDashboard
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stock_dashboard/${{ matrix.artifact }}.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release with download links
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: stock-dashboard-latest
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create "$TAG" out/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "短線篩選看板 執行檔" \
            --notes "下載 StockDashboard-windows.zip，解壓縮後雙擊 StockDashboard.exe，瀏覽器會自動開啟看板。（build ${GITHUB_SHA::7}）"
